services:
  webrtc_server:
    build:
      context: ./webrtc_server
      network: host

    container_name: webrtc_server

    volumes:
      - ./webrtc_server/src/image_listener:/ros2_ws/src/image_listener

    working_dir: /ros2_ws

    restart: on-failure

    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///ros2_ws/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
      - PYTHONUNBUFFERED=1

    networks:
      field_net:
        ipv4_address: 10.68.0.132

    ports:
      - "8088:8088"

    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source install/setup.bash &&
        ros2 run image_listener image_subscriber
      "

  moveit_server:
    build:
      context: ./moveit_server
      network: host

    container_name: moveit_server

    depends_on:
      - webrtc_server

    volumes:
      - ./moveit_server/cyclonedds.xml:/moveit_ws/cyclonedds.xml:ro
      - ./moveit_server/src/vive_moveit_server:/moveit_ws/src/vive_moveit_server

    working_dir: /moveit_ws

    restart: on-failure

    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///moveit_ws/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
      - PYTHONUNBUFFERED=1

    networks:
      field_net:
        ipv4_address: 10.68.0.134

    command: >
      bash -c "
        ros2 launch vive_moveit_server vive_moveit_server.launch.py ${MOVEIT_SERVER_LAUNCH_ARGS:-}
      "

  data_recorder:
    profiles: ["recording"]
    build:
      context: ./data_recorder
      network: host

    container_name: data_recorder
    user: "${VIVE_TELEOP_RECORDING_UID:-1000}:${VIVE_TELEOP_RECORDING_GID:-1000}"
    init: true
    stop_grace_period: 30s
    restart: "no"

    volumes:
      - ./data_recorder/cyclonedds.xml:/recorder_ws/cyclonedds.xml:ro
      - ${VIVE_TELEOP_RECORDING_ROOT:-./recordings}:/recordings

    working_dir: /recorder_ws

    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///recorder_ws/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
      - VIVE_TELEOP_SESSION_ID=${VIVE_TELEOP_SESSION_ID:-manual-session}
      - HOME=/tmp
      - ROS_LOG_DIR=/tmp/vive-dataset-recorder-logs

    networks:
      field_net:
        ipv4_address: 10.68.0.135

    command:
      - ros2
      - run
      - vive_dataset_recorder
      - vive_dataset_recorder
      - --ros-args
      - --params-file
      - /recorder_ws/install/vive_dataset_recorder/share/vive_dataset_recorder/config/recorder.yaml
      - -p
      - recording_mode:=${VIVE_TELEOP_RECORDING_MODE:-deadman_window}
      - -p
      - post_roll_sec:=${VIVE_TELEOP_RECORDING_POST_ROLL_SEC:-0.75}
      - -p
      - capture_gate_stale_timeout_sec:=${VIVE_TELEOP_RECORDING_GATE_TIMEOUT_SEC:-0.25}
      - -p
      - minimum_free_space_bytes:=${VIVE_TELEOP_RECORDING_MIN_FREE_BYTES:-20000000000}

  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    command: ["-c", "/etc/coturn/turnserver.conf"]
    networks:
      field_net:
        ipv4_address: 10.68.0.133

networks:
  field_net:
  #if using wifi connection might be dropped since macvlan assigns multiple virtual mac addresses
  #wifi drivers dont like that. if that is the case use ipvlan and l2 mode
    driver: ipvlan
    driver_opts:
    #NIC=eno1 in .env if connected to wifi instead of ethernet
    #if in doubt check ip addr
      parent: ${NIC:-enp2s0f0}
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: 10.68.0.0/24
          gateway: 10.68.0.1

#sudo ip link add host-ipvlan link enp2s0f0 type ipvlan mode l2
#sudo ip addr add 10.68.0.200/24 dev host-ipvlan
#sudo ip link set host-ipvlan up
