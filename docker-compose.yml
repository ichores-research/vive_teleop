services:
  ros1_bridge:
    build:
      context: ./bridge
      network: host
    cap_add:
      - NET_ADMIN
    command:
      - /bin/bash
      - -c
      - |
        unset ROS_DISTRO
        source /opt/ros/noetic/setup.bash
        export ROS_MASTER_URI=http://10.68.0.1:11311
        unset ROS_DISTRO
        source /opt/ros/foxy/setup.bash
        source /bridge_ws/install/setup.bash
        exec ros2 run ros1_bridge dynamic_bridge --bridge-all-topics
    networks:
      field_net:
        ipv4_address: 10.68.0.52
    environment:
      - ROS_MASTER_URI=http://10.68.0.1:11311
      - ROS_IP=10.68.0.52
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
  ros2_app:
    build:
      context: ./ros2_app
      network: host
    container_name: ros2_app

    volumes:
      - ./ros2_app:/ros2_ws/src/image_listener

    working_dir: /ros2_ws

    restart: unless-stopped

    command: >
      bash -c "
      source /opt/ros/foxy/setup.bash &&
      source install/setup.bash || true &&
      ros2 run image_listener image_subscriber
      "
  vive_tracker:
    build:
      context: ./vive_tracker
      network: host
    container_name: vive_tracker
    privileged: true
    volumes:
      # Required for the container to read raw USB data from the joystick
      - /dev/bus/usb:/dev/bus/usb
      # Required so libsurvive can read device identifiers properly
      - /run/udev:/run/udev:ro
      # Optional: Maps dbus if you still want to experiment with Bluetooth power management
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /dev:/dev # This ensures the container sees /dev/hidraw nodes
      - ./vive_config:/root/.config/libsurvive

networks:
  field_net:
    driver: macvlan
    driver_opts:
      parent: ${NIC:-enp2s0f0}
    ipam:
      config:
        - subnet: 10.68.0.0/24
          gateway: 10.68.0.1
