services:
  ros1_bridge:
    build:
      context: ./bridge
      network: host
    cap_add:
      - NET_ADMIN
    command:
      - /bin/bash
      - -c
      - |
        unset ROS_DISTRO
        source /opt/ros/noetic/setup.bash
        export ROS_MASTER_URI=http://10.68.0.1:11311
        unset ROS_DISTRO
        source /opt/ros/foxy/setup.bash
        source /bridge_ws/install/setup.bash
        exec ros2 run ros1_bridge dynamic_bridge --bridge-all-topics
    networks:
      field_net:
        ipv4_address: 10.68.0.52
    environment:
      - ROS_MASTER_URI=http://10.68.0.1:11311
      - ROS_IP=10.68.0.52
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

networks:
  field_net:
    driver: macvlan
    driver_opts:
      parent: ${NIC:-enp2s0f0}
    ipam:
      config:
        - subnet: 10.68.0.0/24
          gateway: 10.68.0.1
