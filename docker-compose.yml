services:
  ros1_bridge:
    build:
      context: ./bridge
      network: host
    cap_add:
      - NET_ADMIN
    command:
      - /bin/bash
      - -c
      - |
        unset ROS_DISTRO
        source /opt/ros/noetic/setup.bash
        export ROS_MASTER_URI=http://10.68.0.1:11311
        unset ROS_DISTRO
        source /opt/ros/foxy/setup.bash
        source /bridge_ws/install/setup.bash
        exec ros2 run ros1_bridge dynamic_bridge --bridge-all-topics
    networks:
      field_net:
        ipv4_address: 10.68.0.52
    environment:
      - ROS_MASTER_URI=http://10.68.0.1:11311
      - ROS_IP=10.68.0.52
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
  ros2_app:
    build:
      context: ./ros2_app
      network: host
    container_name: ros2_app

    volumes:
      - ./ros2_app:/ros2_ws/src/image_listener

    working_dir: /ros2_ws

    restart: unless-stopped

    command: >
      bash -c "
      source /opt/ros/foxy/setup.bash &&
      source install/setup.bash || true &&
      ros2 run image_listener image_subscriber
      "
  steamvr:
    build:
      context: ./steamvr
      network: host
    container_name: steamvr
    privileged: true
    restart: unless-stopped
    environment:
      - DISPLAY=:99
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute,display
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/bus/usb:/dev/bus/usb
      - /dev:/dev
      - /run/udev:/run/udev:ro
      
      # ── BIND MOUNT FROM HOST ──
      # This replaces the need to download SteamVR inside the container
      # its very annoying to do since you need to log in first,
      # so you need to mount it from host
      - ${HOME}/.local/share/Steam/steamapps/common/SteamVR:/opt/steamvr:ro

      - steamvr_data:/root/.steam
      - steamvr_config:/root/.config/openvr
    devices:
      - /dev/dri:/dev/dri
    runtime: nvidia
    networks:
      field_net:
        ipv4_address: 10.68.0.53
    ports:
      - "5900:5900"

volumes:
  steamvr_data:
  steamvr_config:
  openvr_runtime:

networks:
  field_net:
  #if using wifi connection might be dropped since macvlan assigns multiple virtual mac addresses
  #wifi drivers dont like that. if that is the case use ipvlan and l2 mode
    driver: macvlan
    driver_opts:
    #NIC=wlp4s0 in .env if connected to wifi instead of ethernet
    #if in doubt check ip addr
      parent: ${NIC:-enp2s0f0}
    ipam:
      config:
        - subnet: 10.68.0.0/24
          gateway: 10.68.0.1
