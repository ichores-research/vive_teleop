services:
  ros2_app_wifi:
    build:
      context: ./ros2_app
      network: host
    container_name: ros2_app_wifi
    depends_on:
      - coturn_wifi
    network_mode: host
    volumes:
      - ./ros2_app/src/image_listener:/ros2_ws/src/image_listener
      - ${CYCLONEDDS_HOST_CONFIG:?Run scripts/up-wifi-webrtc.sh or set CYCLONEDDS_HOST_CONFIG}:/tmp/cyclonedds.xml:ro
    working_dir: /ros2_ws
    restart: on-failure
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
      - PYTHONUNBUFFERED=1
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_TURN_URLS}
      - WEBRTC_PUBLIC_HOST=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - WEBRTC_PUBLIC_TURN_URLS=${WEBRTC_PUBLIC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_PUBLIC_TURN_URLS}
      - WEBRTC_TURN_USER=${TURN_USER:-dummy}
      - WEBRTC_TURN_PASSWORD=${TURN_PASSWORD:-dummy}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source install/setup.bash &&
        ros2 run image_listener image_subscriber
      "

  ros2_app:
    depends_on:
      - coturn_wifi
    environment:
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_TURN_URLS}
      - WEBRTC_PUBLIC_HOST=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - WEBRTC_PUBLIC_TURN_URLS=${WEBRTC_PUBLIC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_PUBLIC_TURN_URLS}
      - WEBRTC_TURN_USER=${TURN_USER:-dummy}
      - WEBRTC_TURN_PASSWORD=${TURN_PASSWORD:-dummy}
    networks:
      web_net: {}

  moveit_server_wifi:
    build:
      context: ./moveit_server
      network: host
    container_name: moveit_server_wifi
    depends_on:
      - ros2_app_wifi
    network_mode: host
    volumes:
      - ${CYCLONEDDS_HOST_CONFIG:?Run scripts/up-wifi-webrtc.sh or set CYCLONEDDS_HOST_CONFIG}:/tmp/cyclonedds.xml:ro
    working_dir: /moveit_ws
    restart: on-failure
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        ros2 launch vive_moveit_server vive_moveit_server.launch.py ${MOVEIT_SERVER_LAUNCH_ARGS:-}
      "

  coturn_wifi:
    image: coturn/coturn:latest
    container_name: coturn_wifi
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-ip=127.0.0.1
      - --listening-ip=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - --listening-ip=${ROS_FIELD_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set ROS_FIELD_HOST_IP}
      - --relay-ip=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - --external-ip=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - --min-port=49160
      - --max-port=49200
      - --realm=local
      - --lt-cred-mech
      - --user=${TURN_USER:-dummy}:${TURN_PASSWORD:-dummy}
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --verbose

networks:
  web_net:
    driver: bridge
