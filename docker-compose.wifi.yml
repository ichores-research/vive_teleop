services:
  webrtc_server_wifi:
    build:
      context: ./webrtc_server
      network: host
    container_name: webrtc_server_wifi
    depends_on:
      - coturn_wifi
    network_mode: host
    volumes:
      - ./webrtc_server/src/image_listener:/ros2_ws/src/image_listener
      - ${CYCLONEDDS_HOST_CONFIG:?Run scripts/up-wifi-webrtc.sh or set CYCLONEDDS_HOST_CONFIG}:/tmp/cyclonedds.xml:ro
    working_dir: /ros2_ws
    restart: on-failure
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
      - PYTHONUNBUFFERED=1
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_TURN_URLS}
      - WEBRTC_PUBLIC_HOST=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - WEBRTC_PUBLIC_TURN_URLS=${WEBRTC_PUBLIC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_PUBLIC_TURN_URLS}
      - WEBRTC_TURN_USER=${TURN_USER:-dummy}
      - WEBRTC_TURN_PASSWORD=${TURN_PASSWORD:-dummy}
    command: >
      bash -c "
        source /opt/ros/humble/setup.bash &&
        source install/setup.bash &&
        ros2 run image_listener image_subscriber
      "

  webrtc_server:
    depends_on:
      - coturn_wifi
    environment:
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_TURN_URLS}
      - WEBRTC_PUBLIC_HOST=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - WEBRTC_PUBLIC_TURN_URLS=${WEBRTC_PUBLIC_TURN_URLS:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_PUBLIC_TURN_URLS}
      - WEBRTC_TURN_USER=${TURN_USER:-dummy}
      - WEBRTC_TURN_PASSWORD=${TURN_PASSWORD:-dummy}
    networks:
      web_net: {}

  moveit_server_wifi:
    build:
      context: ./moveit_server
      network: host
    container_name: moveit_server_wifi
    depends_on:
      - webrtc_server_wifi
    network_mode: host
    volumes:
      - ${CYCLONEDDS_HOST_CONFIG:?Run scripts/up-wifi-webrtc.sh or set CYCLONEDDS_HOST_CONFIG}:/tmp/cyclonedds.xml:ro
    working_dir: /moveit_ws
    restart: on-failure
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    ulimits:
      rtprio:
        soft: 90
        hard: 90
      memlock:
        soft: -1
        hard: -1
    command: >
      bash -c "
        ros2 launch vive_moveit_server vive_moveit_server.launch.py ${MOVEIT_SERVER_LAUNCH_ARGS:-}
      "

  data_recorder_wifi:
    profiles: ["recording"]
    build:
      context: ./data_recorder
      network: host
    container_name: data_recorder_wifi
    user: "${VIVE_TELEOP_RECORDING_UID:-1000}:${VIVE_TELEOP_RECORDING_GID:-1000}"
    init: true
    stop_grace_period: 30s
    restart: "no"
    network_mode: host
    volumes:
      - ${CYCLONEDDS_HOST_CONFIG:?Run scripts/up-wifi-webrtc.sh or set CYCLONEDDS_HOST_CONFIG}:/tmp/cyclonedds.xml:ro
      - ${VIVE_TELEOP_RECORDING_ROOT:-./recordings}:/recordings
    working_dir: /recorder_ws
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///tmp/cyclonedds.xml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-67}
      - VIVE_TELEOP_SESSION_ID=${VIVE_TELEOP_SESSION_ID:-manual-session}
      - HOME=/tmp
      - ROS_LOG_DIR=/tmp/vive-dataset-recorder-logs
    command:
      - /recorder_ws/install/vive_dataset_recorder/lib/vive_dataset_recorder/vive_dataset_recorder
      - --ros-args
      - --params-file
      - /recorder_ws/install/vive_dataset_recorder/share/vive_dataset_recorder/config/recorder.yaml
      - -p
      - recording_mode:=${VIVE_TELEOP_RECORDING_MODE:-deadman_window}
      - -p
      - post_roll_sec:=${VIVE_TELEOP_RECORDING_POST_ROLL_SEC:-0.75}
      - -p
      - capture_gate_stale_timeout_sec:=${VIVE_TELEOP_RECORDING_GATE_TIMEOUT_SEC:-0.25}
      - -p
      - minimum_free_space_bytes:=${VIVE_TELEOP_RECORDING_MIN_FREE_BYTES:-20000000000}

  coturn_wifi:
    image: coturn/coturn:latest
    container_name: coturn_wifi
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-ip=127.0.0.1
      - --listening-ip=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - --listening-ip=${ROS_FIELD_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set ROS_FIELD_HOST_IP}
      - --relay-ip=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - --external-ip=${WEBRTC_HOST_IP:?Run scripts/up-wifi-webrtc.sh or set WEBRTC_HOST_IP}
      - --min-port=49160
      - --max-port=49200
      - --realm=local
      - --lt-cred-mech
      - --user=${TURN_USER:-dummy}:${TURN_PASSWORD:-dummy}
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --verbose

networks:
  web_net:
    driver: bridge
