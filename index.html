<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vive Teleop WebRTC Debug</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #181818;
            --panel: #242424;
            --panel-2: #2d2d2d;
            --border: #444;
            --text: #f2f2f2;
            --muted: #b7b7b7;
            --ok: #45b26b;
            --warn: #f0bc42;
            --error: #e15a4f;
            --accent: #5b9bd5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        main {
            display: grid;
            grid-template-rows: auto auto minmax(280px, 1fr) auto;
            min-height: 100vh;
        }

        header,
        .controls,
        .log-panel {
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
        }

        h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 650;
        }

        .status-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
            font-size: 13px;
            color: var(--muted);
        }

        .status {
            min-width: 132px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel-2);
            text-align: left;
            white-space: nowrap;
        }

        .status.ok {
            border-color: color-mix(in srgb, var(--ok) 70%, var(--border));
            color: var(--ok);
        }

        .status.warn {
            border-color: color-mix(in srgb, var(--warn) 70%, var(--border));
            color: var(--warn);
        }

        .status.error {
            border-color: color-mix(in srgb, var(--error) 70%, var(--border));
            color: var(--error);
        }

        .controls {
            display: grid;
            grid-template-columns: minmax(220px, 1.4fr) minmax(170px, 1fr) minmax(150px, 0.8fr) minmax(150px, 0.8fr) auto;
            gap: 12px;
            align-items: end;
            padding: 14px 18px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            min-width: 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #111;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            line-height: 1.35;
        }

        input {
            height: 38px;
            padding: 8px 10px;
        }

        textarea {
            min-height: 86px;
            resize: vertical;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        .relay-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 38px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #111;
            color: var(--text);
            font-size: 14px;
        }

        .relay-toggle input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        .button-row {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .preset-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            height: 38px;
            min-width: 116px;
            padding: 0 14px;
            border: 1px solid transparent;
            border-radius: 6px;
            color: white;
            background: var(--accent);
            font: inherit;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }

        button.secondary {
            border-color: var(--border);
            background: var(--panel-2);
        }

        button.compact {
            min-width: 0;
            height: 30px;
            padding: 0 10px;
            font-size: 12px;
        }

        button.danger {
            background: var(--error);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.48;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(320px, 1fr) minmax(360px, 480px);
            min-height: 0;
        }

        .video-panel {
            display: grid;
            place-items: center;
            min-width: 0;
            min-height: 0;
            padding: 16px;
            background: #090909;
        }

        video {
            width: min(100%, 1280px);
            max-height: calc(100vh - 250px);
            aspect-ratio: 16 / 9;
            border: 1px solid #333;
            border-radius: 6px;
            background: #000;
            object-fit: contain;
        }

        aside {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
            min-width: 0;
            border-left: 1px solid var(--border);
            background: var(--panel);
            padding: 14px;
        }

        h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 650;
        }

        .quick-inputs {
            display: grid;
            gap: 8px;
            align-content: start;
        }

        .input-panels {
            display: grid;
            gap: 12px;
            min-height: 0;
            overflow: auto;
            padding-right: 2px;
        }

        .input-panel {
            display: grid;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--panel-2);
        }

        .input-panel h3 {
            margin: 0;
            font-size: 13px;
            font-weight: 700;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
        }

        .field-grid.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .field-grid.two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .field-grid input {
            height: 34px;
            padding: 6px 8px;
        }

        .log-panel {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: start;
            border-top: 1px solid var(--border);
            border-bottom: 0;
            padding: 10px 18px;
        }

        #log {
            margin: 0;
            max-height: 130px;
            overflow: auto;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        @media (max-width: 980px) {
            main {
                grid-template-rows: auto auto auto auto;
            }

            header,
            .controls,
            .workspace,
            .log-panel {
                display: grid;
                grid-template-columns: 1fr;
            }

            .workspace {
                min-height: auto;
            }

            aside {
                border-left: 0;
                border-top: 1px solid var(--border);
            }

            .field-grid,
            .field-grid.three,
            .field-grid.two {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            video {
                max-height: 52vh;
            }

            .status-row,
            .button-row {
                justify-content: start;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Vive Teleop WebRTC Debug</h1>
            <div class="status-row">
                <div id="videoStatus" class="status">Video: idle</div>
                <div id="inputStatus" class="status">Input: idle</div>
            </div>
        </header>

        <section class="controls">
            <label>
                Server
                <input id="serverUrl" value="http://localhost:8088" spellcheck="false">
                <span class="preset-row">
                    <button id="hostServerBtn" class="secondary compact" type="button">Host :8088</button>
                    <button id="containerServerBtn" class="secondary compact" type="button">10.68.0.132</button>
                </span>
            </label>
            <label>
                TURN
                <input id="turnUrl" value="" spellcheck="false">
            </label>
            <label>
                User
                <input id="turnUser" value="dummy" spellcheck="false">
            </label>
            <label>
                Password
                <input id="turnPassword" value="dummy" type="password" spellcheck="false">
            </label>
            <div class="button-row">
                <label class="relay-toggle">
                    <input id="relayOnly" type="checkbox">
                    Relay only
                </label>
                <button id="startVideoBtn">Start Video</button>
                <button id="connectInputBtn" class="secondary">Input</button>
                <button id="disconnectBtn" class="danger" disabled>Disconnect</button>
            </div>
        </section>

        <section class="workspace">
            <div class="video-panel">
                <video id="videoStream" autoplay playsinline muted></video>
            </div>

            <aside>
                <h2>Input</h2>
                <div class="input-panels">
                    <section class="input-panel">
                        <h3>Head</h3>
                        <label>
                            Frame
                            <input id="headFrame" value="unity_world" spellcheck="false">
                        </label>
                        <div class="field-grid three">
                            <label>X <input id="headPx" type="number" step="0.01" value="0"></label>
                            <label>Y <input id="headPy" type="number" step="0.01" value="1.4"></label>
                            <label>Z <input id="headPz" type="number" step="0.01" value="0"></label>
                        </div>
                        <div class="field-grid two">
                            <label>Pan (rad) <input id="headPan" type="number" step="0.01" value="0"></label>
                            <label>Tilt (rad) <input id="headTilt" type="number" step="0.01" value="0"></label>
                        </div>
                        <div class="field-grid">
                            <label>QX <input id="headRx" type="number" step="0.01" value="0"></label>
                            <label>QY <input id="headRy" type="number" step="0.01" value="0"></label>
                            <label>QZ <input id="headRz" type="number" step="0.01" value="0"></label>
                            <label>QW <input id="headRw" type="number" step="0.01" value="1"></label>
                        </div>
                        <div class="quick-inputs">
                            <button id="sendHeadBtn" disabled>Send Head</button>
                        </div>
                    </section>

                    <section class="input-panel">
                        <h3>Wrist</h3>
                        <div class="field-grid two">
                            <label>
                                Wrist Frame
                                <input id="wristFrame" value="unity_world" spellcheck="false">
                            </label>
                            <label>
                                Robot Frame
                                <input id="robotWristFrame" value="base_footprint" spellcheck="false">
                            </label>
                        </div>
                        <div class="field-grid three">
                            <label>X <input id="wristPx" type="number" step="0.01" value="0.45"></label>
                            <label>Y <input id="wristPy" type="number" step="0.01" value="0"></label>
                            <label>Z <input id="wristPz" type="number" step="0.01" value="0.9"></label>
                        </div>
                        <div class="field-grid">
                            <label>QX <input id="wristRx" type="number" step="0.01" value="0"></label>
                            <label>QY <input id="wristRy" type="number" step="0.01" value="0"></label>
                            <label>QZ <input id="wristRz" type="number" step="0.01" value="0"></label>
                            <label>QW <input id="wristRw" type="number" step="0.01" value="1"></label>
                        </div>
                        <div class="field-grid">
                            <label>RQX <input id="robotWristRx" type="number" step="0.01" value="0"></label>
                            <label>RQY <input id="robotWristRy" type="number" step="0.01" value="0"></label>
                            <label>RQZ <input id="robotWristRz" type="number" step="0.01" value="0"></label>
                            <label>RQW <input id="robotWristRw" type="number" step="0.01" value="1"></label>
                        </div>
                        <div class="field-grid two">
                            <label>Joy X <input id="joystickAxisX" type="number" step="0.01" value="0"></label>
                            <label>Joy Y <input id="joystickAxisY" type="number" step="0.01" value="0"></label>
                        </div>
                        <div class="quick-inputs">
                            <button id="sendWristBtn" disabled>Send Wrist</button>
                            <button id="sendCombinedBtn" class="secondary" disabled>Send All</button>
                        </div>
                    </section>

                    <section class="input-panel">
                        <h3>Gripper</h3>
                        <label>
                            Opening (0 closed, 1 open)
                            <input id="gripperOpening" type="number" min="0" max="1" step="0.01" value="0">
                        </label>
                        <div class="field-grid two">
                            <label>
                                Left position (m)
                                <input id="gripperLeftPosition" type="number" readonly>
                            </label>
                            <label>
                                Right position (m)
                                <input id="gripperRightPosition" type="number" readonly>
                            </label>
                        </div>
                        <div class="quick-inputs">
                            <button id="openGripperBtn" class="secondary" type="button">Open</button>
                            <button id="closeGripperBtn" class="secondary" type="button">Close</button>
                            <button id="sendGripperBtn" disabled>Send Gripper</button>
                        </div>
                    </section>
                </div>
            </aside>
        </section>

        <section class="log-panel">
            <h2>Log</h2>
            <pre id="log"></pre>
            <button id="clearLogBtn" class="secondary">Clear</button>
        </section>
    </main>

    <script>
        const serverUrlEl = document.getElementById('serverUrl');
        const turnUrlEl = document.getElementById('turnUrl');
        const turnUserEl = document.getElementById('turnUser');
        const turnPasswordEl = document.getElementById('turnPassword');
        const relayOnlyEl = document.getElementById('relayOnly');
        const startVideoBtn = document.getElementById('startVideoBtn');
        const connectInputBtn = document.getElementById('connectInputBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const hostServerBtn = document.getElementById('hostServerBtn');
        const containerServerBtn = document.getElementById('containerServerBtn');
        const sendHeadBtn = document.getElementById('sendHeadBtn');
        const sendWristBtn = document.getElementById('sendWristBtn');
        const sendGripperBtn = document.getElementById('sendGripperBtn');
        const sendCombinedBtn = document.getElementById('sendCombinedBtn');
        const openGripperBtn = document.getElementById('openGripperBtn');
        const closeGripperBtn = document.getElementById('closeGripperBtn');
        const gripperLeftPositionEl = document.getElementById('gripperLeftPosition');
        const gripperRightPositionEl = document.getElementById('gripperRightPosition');
        const clearLogBtn = document.getElementById('clearLogBtn');
        const videoEl = document.getElementById('videoStream');
        const videoStatusEl = document.getElementById('videoStatus');
        const inputStatusEl = document.getElementById('inputStatus');
        const logEl = document.getElementById('log');
        const inputControls = {
            headFrame: document.getElementById('headFrame'),
            headPx: document.getElementById('headPx'),
            headPy: document.getElementById('headPy'),
            headPz: document.getElementById('headPz'),
            headPan: document.getElementById('headPan'),
            headTilt: document.getElementById('headTilt'),
            headRx: document.getElementById('headRx'),
            headRy: document.getElementById('headRy'),
            headRz: document.getElementById('headRz'),
            headRw: document.getElementById('headRw'),
            wristFrame: document.getElementById('wristFrame'),
            robotWristFrame: document.getElementById('robotWristFrame'),
            wristPx: document.getElementById('wristPx'),
            wristPy: document.getElementById('wristPy'),
            wristPz: document.getElementById('wristPz'),
            wristRx: document.getElementById('wristRx'),
            wristRy: document.getElementById('wristRy'),
            wristRz: document.getElementById('wristRz'),
            wristRw: document.getElementById('wristRw'),
            robotWristRx: document.getElementById('robotWristRx'),
            robotWristRy: document.getElementById('robotWristRy'),
            robotWristRz: document.getElementById('robotWristRz'),
            robotWristRw: document.getElementById('robotWristRw'),
            joystickAxisX: document.getElementById('joystickAxisX'),
            joystickAxisY: document.getElementById('joystickAxisY'),
            gripperOpening: document.getElementById('gripperOpening'),
        };
        const INPUT_STREAM_INTERVAL_MS = 50;
        const INPUT_POSITION_BLEND = 0.3;
        const INPUT_ORIENTATION_BLEND = 0.25;

        let videoPc = null;
        let inputPc = null;
        let inputChannel = null;
        let inputStreamTimer = null;
        let inputStreamState = null;
        let inputTargetState = null;
        let inputConnecting = false;
        let headPanSign = -1;
        let headTiltSign = -1;

        const params = new URLSearchParams(window.location.search);
        const serverParamProvided = params.has('server');
        const turnParamProvided = params.has('turn');
        serverUrlEl.value = hostServerUrl();
        turnUrlEl.value = hostTurnUrls();

        if (serverParamProvided) {
            serverUrlEl.value = params.get('server');
        }

        if (turnParamProvided) {
            turnUrlEl.value = params.get('turn');
        }

        const configLoadPromise = loadServerConfig();

        function setStatus(element, text, tone) {
            element.textContent = text;
            element.className = 'status';
            if (tone) {
                element.classList.add(tone);
            }
        }

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logEl.textContent = `[${timestamp}] ${message}\n${logEl.textContent}`;
        }

        function endpoint(path) {
            return `${serverUrlEl.value.replace(/\/+$/, '')}${path}`;
        }

        async function loadServerConfig() {
            try {
                const response = await fetch(endpoint('/config'));
                if (!response.ok) {
                    return;
                }

                const config = await response.json();
                if (!serverParamProvided && config.serverUrl) {
                    serverUrlEl.value = config.serverUrl;
                }

                if (!turnParamProvided && Array.isArray(config.iceServers)) {
                    const urls = [];
                    for (const iceServer of config.iceServers) {
                        if (!iceServer || !iceServer.urls) {
                            continue;
                        }
                        if (Array.isArray(iceServer.urls)) {
                            urls.push(...iceServer.urls);
                        } else {
                            urls.push(iceServer.urls);
                        }
                    }
                    if (urls.length) {
                        turnUrlEl.value = urls.join(',');
                    }
                }

                log(`Loaded WebRTC config from ${endpoint('/config')}`);
            } catch (error) {
                log(`Could not load WebRTC config: ${error.message}`);
            }
        }

        function hostServerUrl() {
            const host = window.location.hostname;
            const targetHost = !host || host === '0.0.0.0' ? 'localhost' : host;
            const protocol = window.location.protocol === 'https:' ? 'https:' : 'http:';
            return `${protocol}//${targetHost}:8088`;
        }

        function hostTurnUrls() {
            const host = window.location.hostname;
            const targetHost = !host || host === '0.0.0.0' ? 'localhost' : host;
            return [
                `turn:${targetHost}:3478?transport=udp`,
                `turn:${targetHost}:3478?transport=tcp`,
            ].join(',');
        }

        function describeFetchError(error, path) {
            const target = endpoint(path);

            if (error instanceof TypeError) {
                return [
                    `Cannot fetch ${target}.`,
                    'Try Host :8088 first for the README flow.',
                    'Use 10.68.0.132 only when this browser can route to the ipvlan container.',
                    'Also check that ros2_app is running and CORS errors are not shown in the browser console.',
                ].join(' ');
            }

            return error.message;
        }

        function peerConfig() {
            const iceServers = [{ urls: ['stun:stun.l.google.com:19302'] }];
            const turnUrls = turnUrlEl.value
                .split(',')
                .map((value) => value.trim())
                .filter(Boolean);

            if (turnUrls.length) {
                iceServers.push({
                    urls: turnUrls,
                    username: turnUserEl.value,
                    credential: turnPasswordEl.value,
                });
            }

            return {
                sdpSemantics: 'unified-plan',
                iceTransportPolicy: relayOnlyEl.checked ? 'relay' : 'all',
                iceServers,
            };
        }

        function updateButtons() {
            const inputOpen = inputChannel && inputChannel.readyState === 'open';
            startVideoBtn.disabled = Boolean(videoPc);
            connectInputBtn.disabled = Boolean(inputPc) || inputConnecting;
            disconnectBtn.disabled = !videoPc && !inputPc;
            sendHeadBtn.disabled = !inputOpen;
            sendWristBtn.disabled = !inputOpen;
            sendGripperBtn.disabled = !inputOpen;
            sendCombinedBtn.disabled = !inputOpen;
        }

        function captureInputState() {
            const state = {};
            for (const [id, element] of Object.entries(inputControls)) {
                if (element.type === 'number') {
                    state[id] = numberValue(id);
                } else {
                    state[id] = element.value;
                }
            }
            return state;
        }

        function renderInputState(state) {
            for (const [id, value] of Object.entries(state)) {
                const element = inputControls[id];
                if (!element) {
                    continue;
                }
                element.value = value;
            }
        }

        function setupInputStateSync() {
            for (const [id, element] of Object.entries(inputControls)) {
                element.addEventListener('input', () => {
                    if (!inputTargetState) {
                        if (id === 'headPan' || id === 'headTilt') {
                            syncHeadQuaternionFromJoints();
                        }
                        return;
                    }
                    inputTargetState[id] =
                        element.type === 'number' ? numberValue(id) : element.value;
                    if (id === 'headPan' || id === 'headTilt') {
                        syncHeadQuaternionFromJoints(inputTargetState);
                    }
                });
            }
        }

        function blendNumber(current, target, alpha) {
            return current + ((target - current) * alpha);
        }

        function blendQuaternion(state, target, prefix, alpha) {
            const keys = ['x', 'y', 'z', 'w'].map((axis) => `${prefix}${axis}`);
            const current = keys.map((key) => Number(state[key]));
            let desired = keys.map((key) => Number(target[key]));
            const dot = current.reduce(
                (sum, value, index) => sum + (value * desired[index]),
                0,
            );
            if (dot < 0) {
                desired = desired.map((value) => -value);
            }

            const blended = current.map(
                (value, index) => blendNumber(value, desired[index], alpha),
            );
            const norm = Math.hypot(...blended);
            if (norm < 1e-9) {
                return;
            }
            keys.forEach((key, index) => {
                state[key] = blended[index] / norm;
            });
        }

        function advanceInputStreamState() {
            if (!inputStreamState || !inputTargetState) {
                return;
            }

            for (const id of ['headPan', 'headTilt']) {
                inputStreamState[id] = blendNumber(
                    Number(inputStreamState[id]),
                    Number(inputTargetState[id]),
                    INPUT_POSITION_BLEND,
                );
            }
            syncHeadQuaternionFromJoints(inputStreamState);

            for (const id of ['wristPx', 'wristPy', 'wristPz']) {
                inputStreamState[id] = blendNumber(
                    Number(inputStreamState[id]),
                    Number(inputTargetState[id]),
                    INPUT_POSITION_BLEND,
                );
            }
            blendQuaternion(
                inputStreamState,
                inputTargetState,
                'robotWristR',
                INPUT_ORIENTATION_BLEND,
            );
            blendQuaternion(
                inputStreamState,
                inputTargetState,
                'wristR',
                INPUT_ORIENTATION_BLEND,
            );

            for (const id of ['joystickAxisX', 'joystickAxisY']) {
                inputStreamState[id] = blendNumber(
                    Number(inputStreamState[id]),
                    Number(inputTargetState[id]),
                    INPUT_POSITION_BLEND,
                );
            }

            inputStreamState.gripperOpening = blendNumber(
                Number(inputStreamState.gripperOpening),
                Number(inputTargetState.gripperOpening),
                INPUT_POSITION_BLEND,
            );

            for (const id of ['headFrame', 'wristFrame', 'robotWristFrame']) {
                inputStreamState[id] = inputTargetState[id];
            }
        }

        function syncHeadQuaternionFromJoints(state = null) {
            const pan = numberValue('headPan', state);
            const tilt = numberValue('headTilt', state);
            const inputPan = Math.abs(headPanSign) > 1e-9 ? pan / headPanSign : pan;
            const inputTilt = Math.abs(headTiltSign) > 1e-9 ? tilt / headTiltSign : tilt;
            const halfPan = inputPan * 0.5;
            const halfTilt = inputTilt * 0.5;
            const cosPan = Math.cos(halfPan);
            const sinPan = Math.sin(halfPan);
            const cosTilt = Math.cos(halfTilt);
            const sinTilt = Math.sin(halfTilt);
            const quaternion = {
                headRx: cosPan * sinTilt,
                headRy: sinPan * cosTilt,
                headRz: -sinPan * sinTilt,
                headRw: cosPan * cosTilt,
            };

            for (const [id, value] of Object.entries(quaternion)) {
                inputControls[id].value = value;
                if (state) {
                    state[id] = value;
                }
            }
        }

        function waitForIceGathering(pc) {
            return new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') {
                    resolve();
                    return;
                }

                const timeout = window.setTimeout(() => {
                    pc.removeEventListener('icegatheringstatechange', onStateChange);
                    resolve();
                }, 3000);

                function onStateChange() {
                    if (pc.iceGatheringState === 'complete') {
                        window.clearTimeout(timeout);
                        pc.removeEventListener('icegatheringstatechange', onStateChange);
                        resolve();
                    }
                }

                pc.addEventListener('icegatheringstatechange', onStateChange);
            });
        }

        async function exchangeOffer(pc, path) {
            await configLoadPromise;

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await waitForIceGathering(pc);

            const response = await fetch(endpoint(path), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type,
                }),
            });

            if (!response.ok) {
                const body = await response.text();
                throw new Error(`${path} HTTP ${response.status}${body ? `: ${body}` : ''}`);
            }

            await pc.setRemoteDescription(await response.json());
        }

        function attachStateLogging(pc, label, statusEl) {
            pc.addEventListener('iceconnectionstatechange', () => {
                log(`${label} ICE ${pc.iceConnectionState}`);
                if (pc.iceConnectionState === 'failed') {
                    setStatus(statusEl, `${label}: ICE failed`, 'error');
                    updateButtons();
                }
            });

            pc.addEventListener('connectionstatechange', () => {
                log(`${label} connection ${pc.connectionState}`);
                if (pc.connectionState === 'connected') {
                    setStatus(statusEl, `${label}: connected`, 'ok');
                } else if (pc.connectionState === 'failed') {
                    setStatus(statusEl, `${label}: failed`, 'error');
                } else if (pc.connectionState === 'closed') {
                    setStatus(statusEl, `${label}: closed`);
                }
                updateButtons();
            });
        }

        async function startVideo() {
            videoPc = new RTCPeerConnection(peerConfig());
            attachStateLogging(videoPc, 'Video', videoStatusEl);
            setStatus(videoStatusEl, 'Video: signaling', 'warn');
            updateButtons();

            videoPc.addEventListener('track', (event) => {
                if (event.track.kind === 'video') {
                    videoEl.srcObject = event.streams[0];
                    setStatus(videoStatusEl, 'Video: media', 'ok');
                    log('Video track attached');
                }
            });

            videoPc.addTransceiver('video', { direction: 'recvonly' });

            try {
                await exchangeOffer(videoPc, '/offer');
                setStatus(videoStatusEl, 'Video: answer', 'warn');
                log(`Video offer answered by ${endpoint('/offer')}`);
            } catch (error) {
                log(`Video error: ${describeFetchError(error, '/offer')}`);
                setStatus(videoStatusEl, 'Video: error', 'error');
                await closeVideo();
            } finally {
                updateButtons();
            }
        }

        async function connectInput() {
            inputConnecting = true;
            setStatus(inputStatusEl, 'Input: reading robot', 'warn');
            updateButtons();

            try {
                await configLoadPromise;
                const snapshot = await loadRobotInputState();
                renderRobotInputState(snapshot);
            } catch (error) {
                log(`Robot input state error: ${error.message}`);
                setStatus(inputStatusEl, 'Input: robot state error', 'error');
                inputConnecting = false;
                updateButtons();
                return;
            }

            inputPc = new RTCPeerConnection(peerConfig());
            attachStateLogging(inputPc, 'Input', inputStatusEl);
            inputChannel = inputPc.createDataChannel('input');
            setStatus(inputStatusEl, 'Input: signaling', 'warn');
            updateButtons();

            inputChannel.addEventListener('open', () => {
                setStatus(inputStatusEl, 'Input: open', 'ok');
                log('Input data channel open');
                startInputStream();
                updateButtons();
            });

            inputChannel.addEventListener('close', () => {
                setStatus(inputStatusEl, 'Input: closed');
                log('Input data channel closed');
                stopInputStream();
                updateButtons();
            });

            inputChannel.addEventListener('error', (event) => {
                setStatus(inputStatusEl, 'Input: channel error', 'error');
                log(`Input channel error: ${event.message || 'unknown'}`);
                updateButtons();
            });

            try {
                await exchangeOffer(inputPc, '/input_offer');
                setStatus(inputStatusEl, 'Input: answer', 'warn');
                log(`Input offer answered by ${endpoint('/input_offer')}`);
            } catch (error) {
                log(`Input error: ${describeFetchError(error, '/input_offer')}`);
                setStatus(inputStatusEl, 'Input: error', 'error');
                await closeInput();
            } finally {
                inputConnecting = false;
                updateButtons();
            }
        }

        async function loadRobotInputState() {
            let lastError = null;

            for (let attempt = 0; attempt < 10; attempt += 1) {
                try {
                    const response = await fetch(endpoint('/robot_state'), {
                        cache: 'no-store',
                    });
                    if (!response.ok) {
                        throw new Error(`/robot_state HTTP ${response.status}`);
                    }

                    const snapshot = await response.json();
                    if (
                        snapshot.ready &&
                        snapshot.head &&
                        snapshot.wrist &&
                        snapshot.gripper
                    ) {
                        return snapshot;
                    }

                    const details = Array.isArray(snapshot.errors)
                        ? snapshot.errors.join('; ')
                        : 'Robot pose is not ready';
                    lastError = new Error(details);
                } catch (error) {
                    lastError = error;
                }

                await new Promise((resolve) => window.setTimeout(resolve, 250));
            }

            throw lastError || new Error('Robot pose is not ready');
        }

        function renderRobotInputState(snapshot) {
            const head = snapshot.head;
            const wrist = snapshot.wrist;
            const gripper = snapshot.gripper;
            const headOrientation = head.orientation;
            const wristOrientation = wrist.orientation;
            headPanSign = head.panSign;
            headTiltSign = head.tiltSign;
            const state = {
                headFrame: head.frame,
                headPx: head.position.x,
                headPy: head.position.y,
                headPz: head.position.z,
                headPan: head.pan,
                headTilt: head.tilt,
                headRx: headOrientation.x,
                headRy: headOrientation.y,
                headRz: headOrientation.z,
                headRw: headOrientation.w,
                wristFrame: wrist.frame,
                robotWristFrame: wrist.frame,
                wristPx: wrist.position.x,
                wristPy: wrist.position.y,
                wristPz: wrist.position.z,
                wristRx: wristOrientation.x,
                wristRy: wristOrientation.y,
                wristRz: wristOrientation.z,
                wristRw: wristOrientation.w,
                robotWristRx: wristOrientation.x,
                robotWristRy: wristOrientation.y,
                robotWristRz: wristOrientation.z,
                robotWristRw: wristOrientation.w,
                joystickAxisX: 0,
                joystickAxisY: 0,
                gripperOpening: gripper.opening,
            };

            renderInputState(state);
            gripperLeftPositionEl.value = gripper.leftPosition;
            gripperRightPositionEl.value = gripper.rightPosition;
            inputStreamState = null;
            inputTargetState = null;
            log(
                `Loaded robot input state: head pan=${head.pan.toFixed(4)}, ` +
                `tilt=${head.tilt.toFixed(4)}; wrist ` +
                `xyz=(${wrist.position.x.toFixed(4)}, ` +
                `${wrist.position.y.toFixed(4)}, ${wrist.position.z.toFixed(4)}); ` +
                `gripper opening=${gripper.opening.toFixed(3)}`
            );
        }

        function sendInput(payload, options = {}) {
            if (!inputChannel || inputChannel.readyState !== 'open') {
                if (!options.quiet) {
                    log('Input data channel is not open');
                }
                return false;
            }

            inputChannel.send(payload);
            if (!options.quiet) {
                log(`Sent input: ${payload}`);
            }
            return true;
        }

        function controlValue(id, state) {
            if (state && Object.prototype.hasOwnProperty.call(state, id)) {
                return state[id];
            }
            return inputControls[id].value;
        }

        function numberValue(id, state = null) {
            const value = Number(controlValue(id, state));
            return Number.isFinite(value) ? value : 0;
        }

        function timestampSeconds() {
            return Date.now() / 1000;
        }

        function headFields(state = null) {
            return {
                hmdAvailable: true,
                hmdFrame: controlValue('headFrame', state) || 'unity_world',
                hmdPx: numberValue('headPx', state),
                hmdPy: numberValue('headPy', state),
                hmdPz: numberValue('headPz', state),
                hmdRx: numberValue('headRx', state),
                hmdRy: numberValue('headRy', state),
                hmdRz: numberValue('headRz', state),
                hmdRw: numberValue('headRw', state),
            };
        }

        function wristFields(state = null) {
            return {
                wristAvailable: true,
                wristCommandEnabled: true,
                wristSource: 'debug_page',
                wristFrame: controlValue('wristFrame', state) || 'unity_world',
                wristPx: numberValue('wristPx', state),
                wristPy: numberValue('wristPy', state),
                wristPz: numberValue('wristPz', state),
                wristRx: numberValue('wristRx', state),
                wristRy: numberValue('wristRy', state),
                wristRz: numberValue('wristRz', state),
                wristRw: numberValue('wristRw', state),
                robotWristFrame: controlValue('robotWristFrame', state) || 'base_footprint',
                robotWristRx: numberValue('robotWristRx', state),
                robotWristRy: numberValue('robotWristRy', state),
                robotWristRz: numberValue('robotWristRz', state),
                robotWristRw: numberValue('robotWristRw', state),
                joystickAxisX: numberValue('joystickAxisX', state),
                joystickAxisY: numberValue('joystickAxisY', state),
                joystickTrigger: 0,
                joystickGrip: 0,
                joystickPrimaryButton: false,
            };
        }

        function gripperFields(state = null) {
            return {
                gripperAvailable: true,
                gripperOpening: Math.max(
                    0,
                    Math.min(1, numberValue('gripperOpening', state)),
                ),
            };
        }

        function buildCombinedPayload(state = null) {
            return {
                type: 'unity_teleop_pose',
                timestamp: timestampSeconds(),
                ...headFields(state),
                ...wristFields(state),
                ...gripperFields(state),
            };
        }

        function startInputStream() {
            stopInputStream();
            inputTargetState = captureInputState();
            inputStreamState = { ...inputTargetState };
            renderInputState(inputTargetState);

            const sendCurrentState = () => {
                advanceInputStreamState();
                sendPayloadObject(buildCombinedPayload(inputStreamState), { quiet: true });
            };

            sendCurrentState();
            inputStreamTimer = window.setInterval(sendCurrentState, INPUT_STREAM_INTERVAL_MS);
            log('Input stream started at 20 Hz with target interpolation');
        }

        function stopInputStream() {
            const wasStreaming = Boolean(inputStreamTimer);
            if (inputStreamTimer) {
                window.clearInterval(inputStreamTimer);
                inputStreamTimer = null;
            }
            if (wasStreaming) {
                sendPayloadObject({
                    type: 'browser_wrist_release',
                    timestamp: timestampSeconds(),
                    hmdAvailable: false,
                    wristAvailable: true,
                    wristCommandEnabled: false,
                }, { quiet: true });
            }
        }

        function sendPayloadObject(payload, options = {}) {
            sendInput(JSON.stringify(payload), options);
        }

        function sendHeadPayload() {
            sendPayloadObject({
                type: 'browser_head_pose',
                timestamp: timestampSeconds(),
                ...headFields(),
                wristAvailable: false,
            });
        }

        function sendWristPayload() {
            sendPayloadObject({
                type: 'browser_wrist_target',
                timestamp: timestampSeconds(),
                hmdAvailable: false,
                ...wristFields(),
            });
        }

        function sendGripperPayload() {
            sendPayloadObject({
                type: 'browser_gripper_target',
                timestamp: timestampSeconds(),
                hmdAvailable: false,
                wristAvailable: false,
                ...gripperFields(inputTargetState || captureInputState()),
            });
        }

        function setGripperOpening(opening) {
            const clamped = Math.max(0, Math.min(1, opening));
            inputControls.gripperOpening.value = clamped;
            if (inputTargetState) {
                inputTargetState.gripperOpening = clamped;
            }
        }

        function sendCombinedPayload() {
            sendPayloadObject(buildCombinedPayload(inputTargetState || captureInputState()));
        }

        async function closeVideo() {
            if (videoPc) {
                videoPc.close();
            }
            videoPc = null;
            videoEl.srcObject = null;
            setStatus(videoStatusEl, 'Video: idle');
        }

        async function closeInput() {
            stopInputStream();
            if (inputChannel) {
                inputChannel.close();
            }
            if (inputPc) {
                inputPc.close();
            }
            inputChannel = null;
            inputPc = null;
            inputStreamState = null;
            inputTargetState = null;
            setStatus(inputStatusEl, 'Input: idle');
        }

        async function disconnectAll() {
            await closeVideo();
            await closeInput();
            updateButtons();
            log('Disconnected');
        }

        startVideoBtn.addEventListener('click', startVideo);
        connectInputBtn.addEventListener('click', connectInput);
        disconnectBtn.addEventListener('click', disconnectAll);
        hostServerBtn.addEventListener('click', () => {
            serverUrlEl.value = hostServerUrl();
            log(`Server set to ${serverUrlEl.value}`);
        });
        containerServerBtn.addEventListener('click', () => {
            serverUrlEl.value = 'http://10.68.0.132:8088';
            log(`Server set to ${serverUrlEl.value}`);
        });
        sendHeadBtn.addEventListener('click', sendHeadPayload);
        sendWristBtn.addEventListener('click', sendWristPayload);
        sendGripperBtn.addEventListener('click', sendGripperPayload);
        sendCombinedBtn.addEventListener('click', sendCombinedPayload);
        openGripperBtn.addEventListener('click', () => setGripperOpening(1));
        closeGripperBtn.addEventListener('click', () => setGripperOpening(0));
        clearLogBtn.addEventListener('click', () => {
            logEl.textContent = '';
        });
        window.addEventListener('beforeunload', disconnectAll);

        setupInputStateSync();
        updateButtons();
        log(`Ready for ${serverUrlEl.value}`);
    </script>
</body>
</html>
