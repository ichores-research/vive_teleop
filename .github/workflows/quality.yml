name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell lint
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Ensure demo media is GIF-only
        run: |
          if git ls-files | grep -Ei '\.mp4$'; then
            echo 'MP4 files are not accepted; commit GIF previews instead.' >&2
            exit 1
          fi

      - name: Run non-hardware checks
        run: ./scripts/test-software.sh --static

  ros-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run ROS Python tests in Humble
        run: ./scripts/test-software.sh --ros

  unity-linux:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, vive-teleop-unity]
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Compile Unity Linux player
        run: ./scripts/test-software.sh --unity
