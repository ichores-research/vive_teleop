moveit_servo:
  use_gazebo: false

  command_in_type: speed_units
  # These scales only apply to unitless commands. The C++ Cartesian controller
  # publishes physical speed units, and Servo enforces joint velocity limits.
  scale:
    linear: 2.50
    rotational: 3.50
    joint: 2.50
  # Keep automatic per-joint velocity scaling enabled.
  override_velocity_scaling_factor: 0.0

  publish_period: 0.01
  low_latency_mode: true
  command_out_type: trajectory_msgs/JointTrajectory
  publish_joint_positions: true
  publish_joint_velocities: false
  publish_joint_accelerations: false
  smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
  is_primary_planning_scene_monitor: false

  move_group_name: arm
  planning_frame: base_footprint
  ee_frame_name: arm_tool_link
  robot_link_command_frame: base_footprint

  incoming_command_timeout: 0.10
  num_outgoing_halt_msgs_to_publish: 4
  # The C++ solver already redistributes around a constrained joint. If Servo's
  # final guard still catches one joint, halt that joint only so the complete
  # arm does not appear frozen while the recovery state moves it inward.
  halt_all_joints_in_joint_mode: false

  lower_singularity_threshold: 17.0
  hard_stop_singularity_threshold: 30.0
  joint_limit_margin: 0.08
  leaving_singularity_threshold_multiplier: 2.0

  # The teleop node publishes /servo_node/delta_twist_cmds as the observable
  # Cartesian action, resolves it with limit-aware redundant IK, and sends the
  # physical joint velocity command below. Keep Servo's Cartesian subscriber
  # isolated so its unweighted Humble solver cannot override the joint command.
  cartesian_command_in_topic: /servo_node/cartesian_input_disabled
  joint_command_in_topic: /servo_node/delta_joint_cmds
  joint_topic: /joint_states
  status_topic: /servo_node/status
  command_out_topic: /arm_controller/joint_trajectory

  check_collisions: false
  collision_check_rate: 20.0
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
