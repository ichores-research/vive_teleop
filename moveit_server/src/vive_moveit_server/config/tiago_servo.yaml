use_gazebo: false

# The teleop bridge publishes physical Cartesian velocities.
command_in_type: speed_units
scale:
  linear: 0.15
  rotational: 0.6
  joint: 0.5

publish_period: 0.02
low_latency_mode: true
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
halt_all_joints_in_cartesian_mode: false

# Servo is the only MoveIt motion process and owns the planning scene.
is_primary_planning_scene_monitor: true

move_group_name: arm
planning_frame: base_footprint
ee_frame_name: arm_tool_link
robot_link_command_frame: base_footprint

incoming_command_timeout: 0.12
num_outgoing_halt_msgs_to_publish: 4

lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
# arm_6 commonly rests about 0.12 rad below its upper limit. A 0.1 rad
# margin leaves almost no usable wrist motion and makes Servo halt the
# entire arm immediately. Keep a smaller buffer in addition to the URDF limit.
joint_limit_margin: 0.02
leaving_singularity_threshold_multiplier: 2.0

cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
command_out_topic: /arm_controller/joint_trajectory

# The TIAGo MoveIt model reports a persistent false collision proximity at the
# robot's normal arm pose. It reduced every command to status 3 and prevented
# physical motion. Joint limits and singularity protection remain enabled.
check_collisions: false
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
