vive_moveit_server:
  ros__parameters:
    end_effector_link: arm_tool_link

    head_input_topic: /vive/head_pose
    # Raw Unity HMD orientation is converted into direct TIAGo head trajectory
    # commands inside vive_moveit_server.
    head_command_topic: /head_controller/joint_trajectory
    head_joint_names:
      - head_1_joint
      - head_2_joint
    head_publish_rate_hz: 20.0
    # It tells the controller how much time it has to interpolate from its current position
    # to the new target angle.
    head_command_duration_sec: 0.1

    # A noise filter threshold in radians. Smaller head changes are ignored.
    head_deadband_rad: 0.002
    head_limit_scale: 0.9  # 90% of joint limits
    head_pan_limits_rad: [-1.24, 1.24]
    head_tilt_limits_rad: [-0.98, 0.72]
    head_pan_sign: -1.0
    head_tilt_sign: -1.0
    hand_target_topic: /vive/hand_target_pose
    hand_deadman_topic: /vive/hand_deadman
    gripper_input_topic: /vive/gripper_opening
    gripper_command_topic: /gripper_controller/joint_trajectory
    gripper_joint_names:
      - gripper_right_finger_joint
      - gripper_left_finger_joint
    # Normalized input 0..1 maps each finger from 0.0 m to 0.045 m.
    gripper_min_position_m: 0.0
    gripper_max_position_m: 0.045
    # Ignore duplicate physical targets within 0.5 mm.
    gripper_deadband_m: 0.0005
    # Use at least this duration, extending it to respect the velocity cap.
    gripper_command_duration_sec: 0.15
    gripper_max_velocity_mps: 0.04
    joint_state_topic: /joint_states
    servo_cartesian_command_topic: /servo_node/delta_twist_cmds
    servo_status_topic: /servo_node/status
    servo_start_service_name: /servo_node/start_servo
    # Match the measured 50 Hz robot joint-state feedback rate.
    servo_publish_rate_hz: 50.0
    # High-gain pose tracking with speed and acceleration bounds. MoveIt Servo
    # additionally scales motion near joint limits, singularities, and collisions.
    servo_linear_gain: 6.0
    servo_angular_gain: 5.0
    servo_max_linear_velocity_mps: 0.45
    servo_max_angular_velocity_radps: 1.8
    servo_max_linear_acceleration_mps2: 2.5
    servo_max_angular_acceleration_radps2: 8.0

    # Unity publishes calibrated absolute targets in this robot frame. Each
    # hold is offset to the current TF wrist pose before Servo tracks it.
    pose_reference_frame: base_footprint

    # Explicit /vive/hand_deadman=false stops immediately. This timeout is the
    # fallback for a lost WebRTC/DDS stream. Leave margin above the 50 Hz input.
    hand_target_timeout_sec: 0.25
    position_deadband_m: 0.002
    orientation_deadband_rad: 0.01
    max_hand_target_distance_m: 1.5
    min_hand_target_z_m: 0.2
    max_hand_target_z_m: 1.6
    hand_position_scale: [1.0, 1.0, 1.0]
    hand_position_offset: [0.0, 0.0, 0.0]
