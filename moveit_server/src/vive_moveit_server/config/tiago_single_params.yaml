vive_moveit_server:
  ros__parameters:
    # Use the arm-only group so IK/planning cannot use torso_lift_joint.
    arm_group: arm
    end_effector_link: arm_tool_link

    head_input_topic: /vive/head_pose
    # Raw Unity HMD orientation is converted into direct TIAGo head trajectory
    # commands inside vive_moveit_server.
    head_command_topic: /head_controller/joint_trajectory
    head_joint_names:
      - head_1_joint
      - head_2_joint
    head_publish_rate_hz: 20.0
    #It tells the controller how much time it has to interpolate from its current position 
    # to the new target angle.
    head_command_duration_sec: 0.1
    
    # A noise filter threshold (in radians). 
    #If the difference between the user's new head angle and the previously sent angle
    # is smaller than this value (0.01 ~ 0.57°), the node ignores it
    head_deadband_rad: 0.002
    head_limit_scale: 0.9 # 90% of joint limits
    head_pan_limits_rad: [-1.24, 1.24]
    head_tilt_limits_rad: [-0.98, 0.72]
    head_pan_sign: -1.0
    head_tilt_sign: -1.0
    hand_target_topic: /vive/hand_target_pose
    move_group_action_name: /move_action

    # "ik_topic" uses MoveIt's seeded IK service for small 6-DoF joystick
    # updates, then publishes short JointTrajectory commands.
    # "trajectory_topic" asks MoveIt to plan, then publishes the planned
    # JointTrajectory segments to ROS2 controller topics.
    # Use "moveit" only when ROS2 controller actions are available to MoveIt.
    # "plan_only" validates planning without commanding the robot.
    execution_mode: ik_topic
    arm_command_topic: /arm_controller/joint_trajectory
    torso_command_topic: /torso_controller/joint_trajectory
    joint_state_topic: /joint_states
    ik_service_name: /compute_ik
    async_execution: true
    plan_only: true

    # The server treats incoming hand target coordinates as this robot frame.
    # Adjust calibration/offsets below if your Unity frame is not already aligned.
    pose_reference_frame: base_footprint

    planning_time_sec: 0.15
    max_velocity_scaling_factor: 0.25
    max_acceleration_scaling_factor: 0.25
    min_plan_interval_sec: 0.05
    position_deadband_m: 0.002
    orientation_deadband_rad: 0.01
    goal_position_tolerance_m: 0.015
    goal_orientation_tolerance_rad: 0.08
    num_planning_attempts: 1
    wait_for_move_group_timeout_sec: 0.0
    max_hand_target_distance_m: 1.5
    min_hand_target_z_m: 0.2
    max_hand_target_z_m: 1.6
    ik_timeout_sec: 0.03
    ik_avoid_collisions: false
    command_duration_sec: 0.1
    max_joint_delta_rad: 0.025
    joint_smoothing_alpha: 0.4
    joint_command_deadband_rad: 0.003
    ik_warmup_sec: 0.75
    ik_warmup_min_scale: 0.35
    ik_warmup_reset_after_sec: 2.0
    ik_retry_last_orientation_on_no_solution: true

    hand_position_scale: [1.0, 1.0, 1.0]
    hand_position_offset: [0.0, 0.0, 0.0]

    arm_joint_names:
      - arm_1_joint
      - arm_2_joint
      - arm_3_joint
      - arm_4_joint
      - arm_5_joint
      - arm_6_joint
      - arm_7_joint
    torso_joint_names:
      - torso_lift_joint
