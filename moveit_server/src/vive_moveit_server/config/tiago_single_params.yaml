vive_moveit_server:
  ros__parameters:
    # The arm-only MoveIt group contains arm_1_joint through arm_7_joint and
    # deliberately excludes torso_lift_joint.
    arm_group: arm
    end_effector_link: arm_tool_link
    pose_reference_frame: base_footprint
    joint_state_topic: /joint_states
    robot_description_topic: /robot_description
    arm_joint_names:
      - arm_1_joint
      - arm_2_joint
      - arm_3_joint
      - arm_4_joint
      - arm_5_joint
      - arm_6_joint
      - arm_7_joint

    head_input_topic: /vive/head_pose
    head_command_topic: /head_controller/joint_trajectory
    head_joint_names: [head_1_joint, head_2_joint]
    head_publish_rate_hz: 20.0
    head_command_duration_sec: 0.10
    head_deadband_rad: 0.002
    head_limit_scale: 0.9
    head_pan_limits_rad: [-1.24, 1.24]
    head_tilt_limits_rad: [-0.98, 0.72]
    head_pan_sign: -1.0
    head_tilt_sign: -1.0

    hand_target_topic: /vive/hand_target_pose
    hand_target_active_topic: /vive/hand_target_active
    servo_twist_topic: /servo_node/delta_twist_cmds
    servo_joint_topic: /servo_node/delta_joint_cmds
    servo_pose_target_topic: /servo_node/pose_target_cmds
    servo_pose_active_topic: /servo_node/pose_target_active
    servo_status_topic: /servo_node/status
    servo_start_service: /servo_node/start_servo

    # The C++ Cartesian controller and MoveIt Servo both run at 100 Hz. The C++
    # orientation-first solver resolves rotation before translation and admits
    # joints in the strict order J7 -> J6 -> J5 -> J3 -> J2 -> J4 -> J1.
    arm_control_rate_hz: 100.0
    hand_target_timeout_sec: 0.12
    robot_state_timeout_sec: 0.20
    require_deadman_repress_after_timeout: true
    arm_halt_command_count: 4

    # Redundant resolved-rate IK. Ascending motion cost defines the activation
    # hierarchy. A constrained preferred joint is saturated locally and leaves
    # its Cartesian residual for the next joint rather than slowing the whole
    # arm. Joint-limit weighting starts before the hard predictive bound, then
    # a null-space objective recenters the arm without moving the tool.
    # Near a singularity, adaptive damping and a finite-difference
    # manipulability gradient move the spare degree of freedom toward a better
    # configuration rather than triggering Servo's Cartesian emergency stop.
    ik_damping_threshold: 0.08
    ik_maximum_damping: 0.08
    ik_joint_motion_weights: [12.0, 3.0, 2.0, 4.0, 1.0, 0.5, 0.25]
    ik_singularity_avoidance_threshold: 0.10
    ik_singularity_escape_velocity_radps: 0.30
    ik_singularity_gradient_step_rad: 0.01
    # Keep the two long middle-arm segments out of an upward-pointing posture
    # that can fill the head-camera view. The cost is based on actual link
    # geometry in base_footprint, then projected into the Cartesian task null
    # space so hand tracking remains the primary objective. A normalized slope
    # of 0.10 is about 6 degrees above horizontal. The first segment also has a
    # low-enough target at slope -0.20 (about 12 degrees down); all lower
    # postures are equally good, preventing an endless drift toward joint
    # limits. Visibility smoothly yields to singularity and limit recovery.
    ik_visibility_avoidance_enabled: true
    ik_visibility_link_names: [arm_3_link, arm_4_link, arm_5_link]
    ik_visibility_upward_activation_ratio: 0.10
    ik_visibility_avoidance_velocity_radps: 0.20
    ik_visibility_low_elbow_reward_weight: 0.40
    ik_visibility_low_elbow_target_slope: -0.20
    ik_visibility_gradient_step_rad: 0.01
    ik_visibility_singularity_disable_threshold: 0.04
    ik_visibility_singularity_full_threshold: 0.08
    ik_visibility_joint_margin_disable_buffer_rad: 0.04
    ik_visibility_joint_margin_full_buffer_rad: 0.15
    ik_joint_limit_activation_ratio: 0.65
    ik_joint_limit_weight: 40.0
    ik_joint_centering_gain_radps: 0.35
    ik_maximum_secondary_velocity_radps: 0.40
    # Allow 95% of each URDF velocity limit locally. The remaining headroom and
    # MoveIt Servo's final checks retain the physical limit; per-joint
    # saturation still activates the same dexterity-preserving fallbacks.
    ik_joint_velocity_scale: 0.95
    # These local bands remain materially inside Servo's final 0.08 rad guard.
    # Only outward velocity is reduced; normal and recovery motion retain their
    # configured speed. The longer lookahead accounts for Servo filtering and
    # measured-state latency at the fast-follow acceleration limits.
    ik_joint_limit_margins_rad: [0.14, 0.18, 0.14, 0.20, 0.24, 0.24, 0.24]
    ik_joint_limit_margin_rad: 0.08
    ik_joint_limit_lookahead_sec: 0.45
    joint_limit_recovery_velocity_radps: 0.18
    joint_limit_recovery_gain: 2.0
    joint_limit_recovery_release_buffer_rad: 0.03
    ik_unreachable_linear_residual_mps: 0.20
    ik_unreachable_timeout_sec: 0.50

    # Clutch mapping is one-to-one. Translation stays in base_footprint while
    # orientation deltas are applied in the end-effector's local frame: the
    # configured controller top is therefore the tool top. The RPY rotates the
    # Vive tracking frame into the desired arm_tool_link convention. Keep zero
    # when Unity's calibrated robotWrist pose already uses that convention.
    hand_position_scale: [1.0, 1.0, 1.0]
    controller_to_tool_rotation_rpy_rad: [0.0, 0.0, 0.0]
    # Offset from the tracked controller origin to the physical control point,
    # expressed in controller axes. Leave zero until measured on the actual
    # Vive wand; an incorrect offset makes pure rotation translate the tool.
    controller_top_offset_m: [0.0, 0.0, 0.0]

    max_hand_target_distance_m: 1.5
    min_hand_target_z_m: 0.2
    max_hand_target_z_m: 1.6

    # Fast-follow pose feedback plus target-velocity feed-forward. This profile
    # reaches its Cartesian caps in roughly 0.11-0.16 s while retaining explicit
    # acceleration bounds and Servo smoothing/final joint checks.
    linear_gain: 7.0
    angular_gain: 4.0
    max_linear_velocity_mps: 0.45
    max_angular_velocity_radps: 1.60
    max_linear_acceleration_mps2: 4.0
    max_angular_acceleration_radps2: 10.0
    position_deadband_m: 0.0005
    orientation_deadband_rad: 0.003
    target_filter_cutoff_hz: 20.0
    linear_feedforward_gain: 1.0
    angular_feedforward_gain: 1.0
    feedforward_filter_alpha: 0.55
    feedforward_timeout_sec: 0.05
    feedforward_reset_gap_sec: 0.12
    linear_feedforward_stop_velocity_mps: 0.005
    angular_feedforward_stop_velocity_radps: 0.02

    gripper_input_topic: /vive/gripper_opening
    gripper_command_topic: /gripper_controller/joint_trajectory
    gripper_joint_names:
      - gripper_right_finger_joint
      - gripper_left_finger_joint
    gripper_min_position_m: 0.0
    gripper_max_position_m: 0.045
    gripper_deadband_m: 0.0005
    gripper_command_duration_sec: 0.15
    gripper_max_velocity_mps: 0.04
    joint_state_timeout_sec: 0.25

    base_input_topic: /vive/base_command
    base_active_topic: /vive/base_active
    base_command_topic: /key_vel
    base_command_frame: base_footprint
    base_publish_rate_hz: 30.0
    base_input_timeout_sec: 0.15
    base_halt_command_count: 3
    base_max_linear_velocity_mps: 0.25
    base_max_angular_velocity_radps: 0.6
    base_max_linear_acceleration_mps2: 0.5
    base_max_angular_acceleration_radps2: 1.2
    base_max_linear_deceleration_mps2: 1.0
    base_max_angular_deceleration_radps2: 2.4

    # These are best-effort optimizations, not a claim of end-to-end hard real
    # time: VR sampling, WebRTC, DDS, the robot controller, and the host kernel
    # remain part of the latency budget. Compose grants SYS_NICE/IPC_LOCK.
    enable_realtime_scheduling: true
    realtime_priority: 40
    lock_memory: true
    cpu_affinity: -1
