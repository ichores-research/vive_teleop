arm_torso:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.03
  kinematics_solver_attempts: 1
  mode: local
  stop_optimization_on_valid_solution: true
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.005
  orientation_threshold: 0.02
  cost_threshold: 0.01
  # pick_ik recommends a small non-zero displacement weight for endpoint
  # jogging. The old 0.8 value dominated the pose cost and resisted motion.
  minimal_displacement_weight: 0.001
  avoid_joint_limits_weight: 0.05
  gd_step_size: 0.0001

arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.03
  kinematics_solver_attempts: 1
  mode: local
  stop_optimization_on_valid_solution: true
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.005
  orientation_threshold: 0.02
  cost_threshold: 0.01
  # Keep the local solution near the command-state seed without overwhelming
  # the Cartesian pose objective.
  minimal_displacement_weight: 0.001
  avoid_joint_limits_weight: 0.05
  gd_step_size: 0.0001
